{% extends 'base.html' %}{% block content %}<div class="heading"><h1>رویدادهای مدیریتی</h1><span class="muted">۲۰۰ رویداد اخیر</span></div><section class="card table-card"><div class="table-scroll"><table><thead><tr><th>زمان (UTC)</th><th>عامل</th><th>عملیات</th><th>کاربر هدف</th></tr></thead><tbody>{% for row in rows %}<tr><td dir="ltr">{{ row.at|date }}</td><td>{{ row.actor }}</td><td>{{ row.action }}</td><td>{{ row.target }}</td></tr>{% else %}<tr><td colspan="4" class="empty">رویدادی ثبت نشده است.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
