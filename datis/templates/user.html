{% extends 'base.html' %}{% block content %}<div class="heading"><div><span class="eyebrow">حساب کاربر</span><h1>{{ 'ساخت سرویس جدید' if new else user.username }}</h1></div><a href="/">بازگشت به کاربران</a></div><section class="card editor"><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><div class="form-grid"><label>نام کاربری<input name="username" value="{{ request.form.get('username',user.username) }}" dir="ltr" required minlength="3" maxlength="48" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,47}" {% if not new %}disabled{% endif %}></label><label>{{ 'رمز عبور' if new else 'رمز جدید (اختیاری)' }}<input name="password" type="password" dir="ltr" autocomplete="new-password" minlength="12" maxlength="128" {% if new %}required{% endif %}><small>حداقل ۱۲ کاراکتر؛ رمز ذخیره‌شده قابل مشاهده نیست.</small></label><label>سهمیه کل (GB)<input type="number" name="quota" value="{{ request.form.get('quota',user.quota / 1000000000) }}" min="0" max="1000000" step="0.01" dir="ltr" required><small>صفر = نامحدود. مجموع آپلود و دانلود محاسبه می‌شود.</small></label><label>تاریخ و ساعت انقضا (UTC)<input type="datetime-local" name="expires" value="{{ request.form.get('expires',expiry) }}" dir="ltr" required><small>برای تمدید، تاریخ جدید را انتخاب کنید.</small></label><label>حداکثر اتصال هم‌زمان<input type="number" name="max_connections" value="{{ request.form.get('max_connections',user.max_connections) }}" min="1" max="100" required></label><label class="wide">یادداشت<textarea name="note" maxlength="500" rows="3">{{ request.form.get('note',user.note) }}</textarea></label></div><div class="form-footer"><button class="primary">{{ 'ساخت کاربر' if new else 'ذخیره تغییرات' }}</button><a href="/">انصراف</a></div></form></section>{% if not new %}<section class="card editor"><h2>مدیریت مصرف</h2><p>مصرف فعلی: {{ user.used|gb }} GB. افزایش سهمیه مصرف قبلی را حفظ می‌کند.</p><form method="post" action="/users/{{ user.id }}/action" data-confirm="مصرف این کاربر صفر شود؟ این عمل قابل بازگشت نیست."><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="action" value="reset"><button class="danger">صفرکردن مصرف برای دوره جدید</button></form></section>{% endif %}{% endblock %}
