<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}مدیریت OpenVPN{% endblock %} · DatisVPN</title><link rel="stylesheet" href="{{ url_for('static',filename='panel.css') }}"><script src="{{ url_for('static',filename='panel.js') }}" defer></script></head><body>
<header><a class="brand" href="/" dir="ltr"><span class="mark">D</span> DatisVPN <small>OPENVPN</small></a>{% if session.get('username') %}<nav><a href="/">کاربران</a><a href="/audit">رویدادها</a><a href="/password">تغییر رمز</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">خروج</button></form></nav>{% endif %}</header>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<div role="status" class="alert {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>DatisVPN · مدیریت سرویس OpenVPN <span>نسخه ۰.۱ · زمان‌ها UTC</span></footer></body></html>
